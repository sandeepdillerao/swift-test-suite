version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: testflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-testflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-testflow_secret}
      POSTGRES_DB: ${DB_NAME:-testflow_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - testflow_network

  redis:
    image: redis:7-alpine
    container_name: testflow_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    networks:
      - testflow_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: testflow_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@testflow.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - testflow_network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  testflow_network:
    driver: bridge
